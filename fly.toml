# fly.toml app configuration file generated for fantasy2026 on 2026-06-07T02:39:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fantasy2026'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/fantasy2026.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'fantasy2026_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
